name: Platform Owner Web CI

on:
  push:
    branches:
      - feature/platform-owner-web
    paths:
      - "platform-owner-web/**"
      - ".github/workflows/platform-owner-web-ci.yml"
  pull_request:
    paths:
      - "platform-owner-web/**"
      - ".github/workflows/platform-owner-web-ci.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-owner-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform-owner-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
