name: Backend CI

on:
  push:
    branches:
      - feature/platform-owner-activation
      - feature/platform-owner-web
      - feature/platform-owner-totp-2fa
      - feature/request-tracking
      - fix/multi-instance-accounting-safety
      - fix/accounting-concurrency-hardening
      - feature/financial-foundation
      - feature/workforce-core-pr-wf-03
      - feature/trial-balance-reconciliation
      - feature/default-chart-of-accounts
      - feature/equipment-expenses-accounting
      - feature/driver-worker-ledger
      - feature/default-chart-reconciliation
      - feature/accounting-api-foundation
      - fix/treasury-concurrency-hardening
      - integration/stabilization-2026-11
      - feature/wf08a-correction-snapshots
      - feature/wf08b-measured-correction
      - feature/wf10a-workforce-identity-api
      - feature/wf10c-compensation-basis-mobile
      - feature/wf11a-workforce-member-creation
      - feature/wf11b-workforce-roles-assignments
      - feature/wf12a-workforce-shift-eligibility
      - feature/wf12b-workforce-native-shift-identity
      - feature/wf12c-shift-workforce-identity
    paths:
      - "backend/**"
      - "docs/phases/PHASE-WF-08A-CORRECTION-SNAPSHOT.md"
      - "docs/phases/PHASE-WF-08B-MEASURED-CORRECTION.md"
      - "docs/architecture/workforce-pr-wf-*.md"
      - ".github/workflows/backend-ci.yml"
      - "docs/ACCOUNTING-TREASURY-CONCURRENCY-2026-10-31.md"
      - "docs/ACCOUNTING-PR-MERGE-PLAN-2026-10-31.md"
      - "docs/DRIVER_WORKER_LEDGER_DESIGN.md"
      - "docs/ACCOUNTING-DEFAULT-CHART-2026-11-01.md"
      - "docs/ACCOUNTING-TRIAL-BALANCE-2026-10-31.md"
      - "docs/ACCOUNTING-DEFAULT-CHART-2026-10-31.md"
      - "docs/ACCOUNTING-DEFAULT-CHART-2026-11-01.md"
      - "docs/ACCOUNTING-TRIAL-BALANCE-2026-10-31.md"
  pull_request:
    branches:
      - integration/stabilization-2026-11
      - feature/platform-owner-activation
      - feature/platform-owner-web
      - feature/platform-owner-totp-2fa
      - feature/request-tracking
      - feature/driver-worker-ledger
      - feature/financial-foundation
      - feature/workforce-core-pr-wf-03
      - feature/trial-balance-reconciliation
      - feature/wf08a-correction-snapshots
      - feature/wf10b-mobile-compensation-agreements
      - feature/wf10c-compensation-basis-mobile
      - feature/wf11a-workforce-member-creation
      - feature/wf11b-workforce-roles-assignments
      - feature/wf12a-workforce-shift-eligibility
      - feature/wf12b-workforce-native-shift-identity
    paths:
      - "backend/**"
      - "docs/phases/PHASE-WF-08A-CORRECTION-SNAPSHOT.md"
      - "docs/architecture/workforce-pr-wf-*.md"
      - ".github/workflows/backend-ci.yml"
      - "docs/ACCOUNTING-TREASURY-CONCURRENCY-2026-10-31.md"
      - "docs/ACCOUNTING-PR-MERGE-PLAN-2026-10-31.md"
      - "docs/DRIVER_WORKER_LEDGER_DESIGN.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Maven Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        id: backend-tests
        run: mvn -B -ntp test
      - name: Require WF12B operational projection migration test to execute
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          pattern = "target/surefire-reports/TEST-com.contractor.app.workforce.WorkforceOperationalDriverProjectionMigrationIntegrationTest.xml"
          reports = glob.glob(pattern)
          if not reports:
              sys.exit(f"Required WF12B migration-test report missing: {pattern}")

          root = ET.parse(reports[0]).getroot()
          totals = {key: int(root.attrib.get(key, 0))
                    for key in ("tests", "failures", "errors", "skipped")}
          print(f"WorkforceOperationalDriverProjectionMigrationIntegrationTest: {totals}")

          if totals["tests"] != 1:
              sys.exit("WF12B migration integration test did not execute exactly once.")
          if totals["skipped"] != 0:
              sys.exit("WF12B migration integration test was skipped; Docker/MySQL must be available in CI.")
          if totals["failures"] != 0 or totals["errors"] != 0:
              sys.exit("WF12B migration integration test reported failures or errors.")
          PY

      - name: Require MySQL accounting integration tests to execute
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          pattern = "target/surefire-reports/TEST-com.contractor.app.accounting.domain.JournalPostingConcurrencyIntegrationTest.xml"
          reports = glob.glob(pattern)
          if not reports:
              sys.exit(f"Required MySQL integration-test report missing: {pattern}")

          root = ET.parse(reports[0]).getroot()
          totals = {key: int(root.attrib.get(key, 0))
                    for key in ("tests", "failures", "errors", "skipped")}
          print(f"JournalPostingConcurrencyIntegrationTest: {totals}")

          if totals["tests"] == 0:
              sys.exit("Accounting concurrency integration tests did not execute.")
          if totals["skipped"] != 0:
              sys.exit("Accounting concurrency integration tests were skipped; Docker/MySQL must be available in CI.")
          if totals["failures"] != 0 or totals["errors"] != 0:
              sys.exit("Accounting concurrency integration tests reported failures or errors.")
          PY

      - name: Require V24 existing-data migration test to execute
        run: |
          if [ ! -f src/test/java/com/contractor/app/accounting/domain/CashBankClassificationMigrationIntegrationTest.java ]; then
            echo "V24 migration test is not part of this branch yet; skipping this guard."
            exit 0
          fi
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          pattern = "target/surefire-reports/TEST-com.contractor.app.accounting.domain.CashBankClassificationMigrationIntegrationTest.xml"
          reports = glob.glob(pattern)
          if not reports:
              sys.exit(f"Required V24 migration-test report missing: {pattern}")

          root = ET.parse(reports[0]).getroot()
          totals = {key: int(root.attrib.get(key, 0))
                    for key in ("tests", "failures", "errors", "skipped")}
          print(f"CashBankClassificationMigrationIntegrationTest: {totals}")

          if totals["tests"] != 1:
              sys.exit("V24 existing-data migration test did not execute exactly once.")
          if totals["skipped"] != 0:
              sys.exit("V24 migration test was skipped; Docker/MySQL must be available in CI.")
          if totals["failures"] != 0 or totals["errors"] != 0:
              sys.exit("V24 migration test reported failures or errors.")
          PY

      - name: Require financial idempotency MySQL integration tests to execute
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          required = {
              "DriverLedgerIdempotencyIntegrationTest": 4,
              "ExpenseIntegrationTest": 12,
          }
          for name, expected in required.items():
              pattern = f"target/surefire-reports/TEST-com.contractor.app.{'driver' if name.startswith('Driver') else 'expense'}.{name}.xml"
              reports = glob.glob(pattern)
              if not reports:
                  sys.exit(f"Required financial idempotency report missing: {pattern}")
              root = ET.parse(reports[0]).getroot()
              totals = {key: int(root.attrib.get(key, 0))
                        for key in ("tests", "failures", "errors", "skipped")}
              print(f"{name}: {totals}")
              if totals["tests"] < expected:
                  sys.exit(f"{name} must execute at least {expected} tests.")
              if totals["skipped"] != 0:
                  sys.exit(f"{name} was skipped; Docker/MySQL must be available in CI.")
              if totals["failures"] != 0 or totals["errors"] != 0:
                  sys.exit(f"{name} reported failures or errors.")
          PY

      - name: Require shift wage and zero-cost equipment integration tests to execute
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          pattern = "target/surefire-reports/TEST-com.contractor.app.shift.ShiftIntegrationTest.xml"
          reports = glob.glob(pattern)
          if not reports:
              sys.exit(f"Required shift integration-test report missing: {pattern}")

          root = ET.parse(reports[0]).getroot()
          totals = {key: int(root.attrib.get(key, 0))
                    for key in ("tests", "failures", "errors", "skipped")}
          names = [case.attrib.get("name") for case in root.findall(".//testcase")]
          required = {
              "approvedZeroWageShiftCanFinishWithoutWageOrAdvanceRecoveryPostings",
              "previouslyFinishedZeroWageShiftCanBeReinstatedWithoutWageJournal",
              "finishRecognizesDriverWageExactlyOnce",
              "databaseRejectsCompletingPositiveWageShiftWithoutJournal",
              "databaseRejectsUnrelatedJournalLinkEvenWhenShiftWageIsZero",
              "zeroEquipmentOperatingCostDoesNotPreventShiftCompletion",
          }
          print(f"ShiftIntegrationTest: {totals}")
          missing = required.difference(names)
          if missing:
              sys.exit(f"Required shift wage/equipment tests did not execute: {sorted(missing)}")
          if any(names.count(name) != 1 for name in required):
              sys.exit("Required shift wage/equipment integration tests must each execute exactly once.")
          if totals["skipped"] != 0:
              sys.exit("Shift integration tests were skipped; Docker/MySQL must be available in CI.")
          if totals["failures"] != 0 or totals["errors"] != 0:
              sys.exit("Shift integration tests reported failures or errors.")
          PY

      - name: Require chart-of-accounts tenant-isolation integration tests to execute
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          pattern = "target/surefire-reports/TEST-com.contractor.app.accounting.ChartOfAccountsTenantIsolationIntegrationTest.xml"
          reports = glob.glob(pattern)
          if not reports:
              sys.exit(f"Required chart tenant-isolation test report missing: {pattern}")

          root = ET.parse(reports[0]).getroot()
          totals = {key: int(root.attrib.get(key, 0))
                    for key in ("tests", "failures", "errors", "skipped")}
          print(f"ChartOfAccountsTenantIsolationIntegrationTest: {totals}")

          if totals["tests"] != 3:
              sys.exit("Chart-of-accounts tenant-isolation integration test class must execute exactly three tests.")
          if totals["skipped"] != 0:
              sys.exit("Chart-of-accounts tenant-isolation tests were skipped.")
          if totals["failures"] != 0 or totals["errors"] != 0:
              sys.exit("Chart-of-accounts tenant-isolation tests reported failures or errors.")
          PY

      - name: Require default chart and journal-linkage tests to execute
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          required = {
              "DefaultChartOfAccountsServiceTest": 9,
              "DefaultChartOfAccountsConcurrencyIntegrationTest": 1,
              "ShiftIntegrationTest": 1,
              "ExpenseIntegrationTest": 1,
          }
          for suite, minimum in required.items():
              pattern = f"target/surefire-reports/TEST-*{suite}.xml"
              reports = glob.glob(pattern)
              if not reports:
                  sys.exit(f"Required accounting report missing: {pattern}")
              root = ET.parse(reports[0]).getroot()
              totals = {key: int(root.attrib.get(key, 0))
                        for key in ("tests", "failures", "errors", "skipped")}
              print(f"{suite}: {totals}")
              if totals["tests"] < minimum:
                  sys.exit(f"{suite} did not execute the required number of tests.")
              if totals["skipped"] != 0 or totals["failures"] != 0 or totals["errors"] != 0:
                  sys.exit(f"{suite} has skipped tests, failures, or errors.")
          PY

      - name: Require trial-balance MySQL integration tests to execute
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          pattern = "target/surefire-reports/TEST-com.contractor.app.accounting.TrialBalanceIntegrationTest.xml"
          reports = glob.glob(pattern)
          if not reports:
              sys.exit(f"Required trial-balance integration-test report missing: {pattern}")

          root = ET.parse(reports[0]).getroot()
          totals = {key: int(root.attrib.get(key, 0))
                    for key in ("tests", "failures", "errors", "skipped")}
          print(f"TrialBalanceIntegrationTest: {totals}")
          if totals["tests"] < 7:
              sys.exit("Trial-balance integration tests did not all execute.")
          if totals["skipped"] != 0 or totals["failures"] != 0 or totals["errors"] != 0:
              sys.exit("Trial-balance integration tests were skipped or reported failures/errors.")
          PY

      - name: Require WorkforceMember migration and compatibility tests to execute
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          required = {
              "WorkforceMemberMigrationIntegrationTest": 1,
              "WorkforceMemberBackfillIntegrationTest": 4,
          }
          for suite, expected in required.items():
              pattern = f"target/surefire-reports/TEST-com.contractor.app.workforce.{suite}.xml"
              reports = glob.glob(pattern)
              if not reports:
                  sys.exit(f"Required workforce integration-test report missing: {pattern}")
              root = ET.parse(reports[0]).getroot()
              totals = {key: int(root.attrib.get(key, 0))
                        for key in ("tests", "failures", "errors", "skipped")}
              print(f"{suite}: {totals}")
              if totals["tests"] != expected:
                  sys.exit(f"{suite} must execute exactly {expected} tests.")
              if totals["skipped"] != 0 or totals["failures"] != 0 or totals["errors"] != 0:
                  sys.exit(f"{suite} was skipped or reported failures/errors.")
          PY

      - name: Require Workforce role and assignment integration tests to execute
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          pattern = "target/surefire-reports/TEST-com.contractor.app.workforce.WorkforceAssignmentIntegrationTest.xml"
          reports = glob.glob(pattern)
          if not reports:
              sys.exit(f"Required workforce role/assignment report missing: {pattern}")

          root = ET.parse(reports[0]).getroot()
          totals = {key: int(root.attrib.get(key, 0))
                    for key in ("tests", "failures", "errors", "skipped")}
          print(f"WorkforceAssignmentIntegrationTest: {totals}")
          if totals["tests"] != 6:
              sys.exit("WorkforceAssignmentIntegrationTest must execute exactly six tests.")
          if totals["skipped"] != 0 or totals["failures"] != 0 or totals["errors"] != 0:
              sys.exit("Workforce role/assignment tests were skipped or reported failures/errors.")
          PY

      - name: Require compensation agreement schema integration tests to execute
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          pattern = "target/surefire-reports/TEST-com.contractor.app.workforce.CompensationAgreementSchemaIntegrationTest.xml"
          reports = glob.glob(pattern)
          if not reports:
              sys.exit(f"Required compensation agreement schema report missing: {pattern}")

          root = ET.parse(reports[0]).getroot()
          totals = {key: int(root.attrib.get(key, 0))
                    for key in ("tests", "failures", "errors", "skipped")}
          print(f"CompensationAgreementSchemaIntegrationTest: {totals}")
          if totals["tests"] != 3:
              sys.exit("CompensationAgreementSchemaIntegrationTest must execute exactly three tests.")
          if totals["skipped"] != 0 or totals["failures"] != 0 or totals["errors"] != 0:
              sys.exit("Compensation agreement schema tests were skipped or reported failures/errors.")
          PY

      - name: Require WF-08A historical correction migration test to execute
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          pattern = "target/surefire-reports/TEST-com.contractor.app.shift.ShiftCorrectionSnapshotMigrationIntegrationTest.xml"
          reports = glob.glob(pattern)
          if not reports:
              sys.exit(f"Required WF-08A migration-test report missing: {pattern}")

          root = ET.parse(reports[0]).getroot()
          totals = {key: int(root.attrib.get(key, 0))
                    for key in ("tests", "failures", "errors", "skipped")}
          print(f"ShiftCorrectionSnapshotMigrationIntegrationTest: {totals}")

          if totals["tests"] != 1:
              sys.exit("WF-08A historical correction migration test must execute exactly once.")
          if totals["skipped"] != 0:
              sys.exit("WF-08A migration test was skipped; Docker/MySQL must be available in CI.")
          if totals["failures"] != 0 or totals["errors"] != 0:
              sys.exit("WF-08A migration test reported failures or errors.")
          PY

      - name: Require WF-08B measured shift correction integration tests to execute
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          pattern = "target/surefire-reports/TEST-com.contractor.app.shift.ShiftCorrectionIntegrationTest.xml"
          reports = glob.glob(pattern)
          if len(reports) != 1:
              sys.exit(f"Expected exactly one WF-08B correction integration-test report: {pattern}")

          root = ET.parse(reports[0]).getroot()
          totals = {key: int(root.attrib.get(key, 0))
                    for key in ("tests", "failures", "errors", "skipped")}
          names = [case.attrib.get("name") for case in root.findall(".//testcase")]
          required = {
              "hourlyCorrectionRecalculatesFromFrozenRateAndReversesFinancialEntries",
              "quantityCorrectionRecalculatesFromFrozenUnitRate",
              "zeroRateHourlyCorrectionCreatesNoZeroFinancialEntries",
              "hourlyCorrectionRejectsMissingOrConflictingMeasurementAndClientWage",
              "zeroRateQuantityCorrectionCreatesNoZeroFinancialEntries",
          }
          print(f"WF-08B ShiftCorrectionIntegrationTest: {totals}")
          missing = required.difference(names)
          if missing:
              sys.exit(f"Required measured correction tests did not execute: {sorted(missing)}")
          if any(names.count(name) != 1 for name in required):
              sys.exit("Each required measured correction integration test must execute exactly once.")
          if totals["skipped"] != 0 or totals["failures"] != 0 or totals["errors"] != 0:
              sys.exit("WF-08B measured correction tests were skipped or reported failures/errors.")
          PY

      - name: Require WF12C shift Workforce identity migration test to execute
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          pattern = "target/surefire-reports/TEST-com.contractor.app.shift.ShiftWorkforceIdentityMigrationIntegrationTest.xml"
          reports = glob.glob(pattern)
          if not reports:
              sys.exit(f"Required WF12C migration-test report missing: {pattern}")

          root = ET.parse(reports[0]).getroot()
          totals = {key: int(root.attrib.get(key, 0))
                    for key in ("tests", "failures", "errors", "skipped")}
          print(f"ShiftWorkforceIdentityMigrationIntegrationTest: {totals}")

          if totals["tests"] != 1:
              sys.exit("WF12C shift Workforce identity migration test did not execute exactly once.")
          if totals["skipped"] != 0:
              sys.exit("WF12C migration test was skipped; Docker/MySQL must be available in CI.")
          if totals["failures"] != 0 or totals["errors"] != 0:
              sys.exit("WF12C migration test reported failures or errors.")
          PY

      - name: Write test summary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.backend-tests.outcome }}
        run: |
          python3 - <<'PY'
          import glob
          import os
          import sys
          import xml.etree.ElementTree as ET

          files = glob.glob("target/surefire-reports/TEST-*.xml")
          summary = os.environ["GITHUB_STEP_SUMMARY"]

          with open(summary, "a", encoding="utf-8") as out:
              out.write("# Backend test results\n\n")
              out.write(
                  f"- Maven test step: **{os.environ['TEST_OUTCOME']}**\n"
              )
              out.write(
                  f"- Commit: `{os.environ.get('GITHUB_SHA', 'unknown')}`\n"
              )

              if not files:
                  out.write(
                      "- Surefire reports: **not generated**; "
                      "inspect the job logs.\n"
                  )
                  sys.exit(0)

              totals = {
                  "tests": 0,
                  "failures": 0,
                  "errors": 0,
                  "skipped": 0,
              }

              for path in files:
                  root = ET.parse(path).getroot()
                  for key in totals:
                      totals[key] += int(root.attrib.get(key, 0))

              out.write("\n## Surefire totals\n\n")
              out.write("| Metric | Count |\n")
              out.write("|---|---:|\n")
              for key, value in totals.items():
                  out.write(f"| {key.capitalize()} | {value} |\n")

              passed = (
                  totals["tests"]
                  - totals["failures"]
                  - totals["errors"]
                  - totals["skipped"]
              )
              out.write(f"| Passed (calculated) | {passed} |\n")
          PY

      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
