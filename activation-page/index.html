<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="color-scheme" content="light">
  <title>تفعيل حساب المدير | Contractor Manager</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./config.js"></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="activation-card" aria-labelledby="page-title">
      <div class="brand-mark" aria-hidden="true">CM</div>
      <p class="eyebrow">Contractor Manager</p>
      <h1 id="page-title">تفعيل حساب المدير</h1>
      <p class="intro">أنشئ كلمة مرور آمنة لإكمال تفعيل حسابك.</p>

      <div id="status" class="status" role="status" aria-live="polite" hidden></div>

      <form id="activation-form" autocomplete="on">
        <label for="password">كلمة المرور الجديدة</label>
        <input id="password" name="password" type="password" autocomplete="new-password"
               minlength="12" maxlength="100" required>
        <p class="hint">يجب ألا تقل كلمة المرور عن 12 حرفًا.</p>

        <label for="confirm-password">تأكيد كلمة المرور</label>
        <input id="confirm-password" name="confirmPassword" type="password"
               autocomplete="new-password" minlength="12" maxlength="100" required>

        <button id="submit-button" type="submit">تفعيل الحساب</button>
      </form>

      <p class="security-note">رابط التفعيل مؤقت ويُستخدم مرة واحدة فقط. لا تشارك الرابط مع أي شخص آخر.</p>
    </section>
    <footer>© Contractor Manager</footer>
  </main>
</body>
</html>
