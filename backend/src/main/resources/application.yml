server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  application:
    name: contractor-manager
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    # القيم الحساسة تأتي من متغيرات البيئة فقط ولا توجد افتراضات لها.
    url: ${DB_URL:jdbc:mysql://localhost:3308/contractor?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      # Applied to each newly created physical connection; bounds InnoDB row-lock waits.
      connection-init-sql: SET SESSION innodb_lock_wait_timeout=3
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # المخطط تملكه Flyway فقط، وHibernate يتحقق منه ولا يعدّله
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    issuer: contractor-manager
    access-token-minutes: 15
    refresh-token-days: 30
  registration:
    enabled: ${APP_REGISTRATION_ENABLED:false}
  # المنطقة الزمنية لحساب "اليوم" (لرفض الورديات بتاريخ مستقبلي). التخزين نفسه بتوقيت UTC.
  business-timezone: Africa/Cairo

# Disabled by default; explicitly enable in local development via SWAGGER_ENABLED=true.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
